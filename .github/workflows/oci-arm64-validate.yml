name: oci-arm64-validate

# Build-readiness for a future Oracle Cloud (OCI) Ampere A1 host. VALIDATION ONLY.
#
# Builds the Operations image for linux/arm64 on GitHub's native arm64 runner and
# proves it runs: architecture, baked commit, startup with migrations against a
# throwaway Postgres on the runner, /version, /health, tesseract OCR, the native
# Python libraries, and the dashboard assets.
#
# Isolated from production by construction (tests/test_oci_arm64_validation_is_isolated.py
# pins every point):
#   * a separate file; deploy.yml and its amd64 image are untouched
#   * never runs for main, never uses the `production` environment, its secrets,
#     SSH, or the deploy host; nothing here can reach KVM1
#   * the image is built under a DIFFERENT repository name. teleautomation-deploy
#     pulls only from its one fixed repository, so it cannot be handed this image
#     by digest or by tag, and the production package's retention is unaffected
#   * pushing is opt-in (manual run with push=true) and still goes to that
#     separate repository, tag oci-arm64-test-<sha>, as one plain single-arch
#     manifest (no index), exactly the shape the deploy script validates
#   * its own build-cache scope, so the amd64 cache is never shared or evicted
on:
  push:
    branches: ["migration/oci-**"]
  workflow_dispatch:
    inputs:
      push:
        description: "Also push the validated image to the separate test repository (never the production one)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: oci-arm64-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_IMAGE_REPO: ghcr.io/codetrust2025-spec/teleautomation-operations-oci-arm64-test
  TEST_TAG_PREFIX: oci-arm64-test-

jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Name the image
        id: meta
        run: |
          echo "tag=${TEST_IMAGE_REPO}:${TEST_TAG_PREFIX}${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: The runner itself is arm64
        run: |
          uname -m
          [ "$(uname -m)" = "aarch64" ] || { echo "::error::expected an aarch64 runner, got $(uname -m)"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64 (loaded locally, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tag }}
          labels: |
            org.teleautomation.build-target=oci-arm64-test
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            RELEASE_BUILT_AT=${{ steps.meta.outputs.built_at }}
          cache-from: type=gha,scope=operations-image-arm64-test
          cache-to: type=gha,scope=operations-image-arm64-test,mode=max

      - name: Image is linux/arm64 with the right commit baked in
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          arch=$(docker image inspect "$TAG" --format '{{.Os}}/{{.Architecture}}')
          label=$(docker image inspect "$TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          target=$(docker image inspect "$TAG" --format '{{ index .Config.Labels "org.teleautomation.build-target" }}')
          baked=$(docker image inspect "$TAG" --format '{{ range .Config.Env }}{{ println . }}{{ end }}' | sed -n 's/^RELEASE_SHA=//p' | head -1)
          echo "platform=$arch revision=$label RELEASE_SHA=$baked target=$target"
          [ "$arch" = "linux/arm64" ] || { echo "::error::image is $arch, expected linux/arm64"; exit 1; }
          [ "$label" = "$GITHUB_SHA" ] || { echo "::error::revision label $label != $GITHUB_SHA"; exit 1; }
          [ "$baked" = "$GITHUB_SHA" ] || { echo "::error::RELEASE_SHA $baked != $GITHUB_SHA"; exit 1; }
          [ "$target" = "oci-arm64-test" ] || { echo "::error::build-target label missing"; exit 1; }

      - name: Native Python libraries import on arm64
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run --rm --network none "$TAG" python -c "
          import platform, importlib
          assert platform.machine() == 'aarch64', platform.machine()
          mods = ['PIL.Image', 'fitz', 'pdfplumber', 'pytesseract', 'psycopg2', 'cryptography.fernet',
                  'uvloop', 'httptools', 'watchfiles', 'websockets', 'yaml', 'jsonschema', 'httpx',
                  'fastapi', 'python_multipart', 'main', 'scripts.ops_health', 'core.job_heartbeats']
          for m in mods:
              importlib.import_module(m)
          print('imports ok on', platform.machine(), '-', len(mods), 'modules')
          "

      - name: Tesseract is present and reads text on arm64
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker run --rm --network none "$TAG" tesseract --version | head -1
          docker run --rm --network none "$TAG" python -c "
          from PIL import Image, ImageDraw, ImageFont
          import pytesseract
          img = Image.new('RGB', (900, 180), 'white')
          draw = ImageDraw.Draw(img)
          try:
              font = ImageFont.truetype('DejaVuSans.ttf', 72)
          except OSError:
              font = ImageFont.load_default(size=72)
          draw.text((30, 40), 'ARM64 OCR 4711', fill='black', font=font)
          text = pytesseract.image_to_string(img)
          print('OCR read:', repr(text.strip()))
          assert '4711' in text, text
          "

      - name: Start it the way CI starts amd64 (throwaway Postgres on this runner)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cp .env.example .env
          cat > compose.arm64-test.yml <<EOF
          services:
            api: {image: "${TAG}", pull_policy: never}
            migrate: {image: "${TAG}", pull_policy: never}
          EOF
          echo "COMPOSE_FILE=docker-compose.yml:compose.arm64-test.yml" >> "$GITHUB_ENV"
          COMPOSE_FILE=docker-compose.yml:compose.arm64-test.yml docker compose up -d --no-build

      - name: /health passes
        run: curl --fail --retry 30 --retry-delay 5 --retry-all-errors http://127.0.0.1:8200/health

      - name: /version reports this commit
        run: |
          got=$(curl -s http://127.0.0.1:8200/version | python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])')
          echo "/version sha=$got"
          [ "$got" = "$GITHUB_SHA" ] || { echo "::error::/version is $got, expected $GITHUB_SHA"; exit 1; }

      - name: Dashboard and its assets are served
        run: |
          set -euo pipefail
          curl -s -o /tmp/index.html -w '%{http_code}' http://127.0.0.1:8200/ | grep -qx 200
          asset=$(grep -oE '/assets/[^"]+\.(js|css)' /tmp/index.html | head -1)
          [ -n "$asset" ] || { echo "::error::index.html references no /assets/ file"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8200${asset}")
          echo "index 200, $asset $code"
          [ "$code" = "200" ]

      - name: Migrations ran and are idempotent
        run: |
          docker compose run --rm -T migrate | tee /tmp/second-run.txt
          test ! -s /tmp/second-run.txt

      - name: No architecture-related errors in the logs
        run: |
          docker compose logs --no-color > /tmp/compose.log 2>&1
          echo "log lines: $(wc -l < /tmp/compose.log)"
          if grep -nEi 'exec format error|illegal instruction|wrong ELF class|cannot open shared object file|undefined symbol|no matching manifest' /tmp/compose.log; then
            echo "::error::architecture-related error in the container logs"; exit 1
          fi
          echo "none found"

      - if: always()
        name: Logs on failure
        run: docker compose logs --no-color --tail 80 || true
      - if: always()
        run: docker compose down -v || true

  # Opt-in only. Pushes the image that was just validated, rebuilt from the same
  # cache, to the separate test repository as one plain arm64 manifest.
  push:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.push
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push linux/arm64 to the test repository
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ needs.validate.outputs.tag }}
          labels: |
            org.teleautomation.build-target=oci-arm64-test
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=operations-image-arm64-test
      - name: Pushed as one plain arm64 manifest
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          raw=$(docker buildx imagetools inspect "$TAG" --raw)
          media=$(printf '%s' "$raw" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("mediaType", ""))')
          echo "mediaType=$media digest=${{ steps.build.outputs.digest }}"
          case "$media" in *manifest.list*|*image.index*) echo "::error::pushed an index, expected one plain manifest"; exit 1 ;; esac
