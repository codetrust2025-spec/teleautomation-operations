name: ci

# `on: [push, pull_request]` ran this workflow twice for every branch with a PR
# open: once for the push, once for the pull_request, executing an identical job
# both times. Restricting push to main keeps the post-merge run -- which is the
# safety net the fast lane below depends on -- and drops only the duplicate.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository. Saying so removes the dependence on a
# repository-level default that can change without touching this file, and that
# already differed between the two repositories.
permissions:
  contents: read

# Superseded runs on the same PR are cancelled. main is never cancelled: the
# post-merge run is what proves a merged commit passes the full suite.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The dual-service verification checks out the private Marketing repository
  # with a read-only deploy key (secret MARKETING_READ_DEPLOY_KEY). While this is
  # "false", a run without that key reports the job as skipped and passes -- the
  # Marketing release-anchor PR still runs the same verification before any
  # deploy. The cutover to CI-driven deploys sets it to "true", after which a
  # missing key fails the check instead of skipping it.
  REQUIRE_DUAL_SERVICE: "false"

jobs:
  # Which lane a change takes. Fail-safe by construction: the fast lane requires
  # every changed path to match a narrow allowlist, so anything unrecognised --
  # a new file type, a renamed directory, an empty or failed file listing --
  # falls through to `full`.
  classify:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.pick.outputs.lane }}
    steps:
      - uses: actions/checkout@v4
        # Full history, so the diff against the base commit is available
        # locally and the classifier needs no API call for it.
        with: {fetch-depth: 0}
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          # A push to main always runs the full suite. The fast lane is a
          # pre-merge gate only, so every commit that lands still gets complete
          # verification even when its PR was fast-laned.
          if [ "$EVENT" != "pull_request" ]; then
            echo "lane=full" >> "$GITHUB_OUTPUT"
            echo "::notice::full lane: event is $EVENT, not a pull request"
            exit 0
          fi
          # From git rather than the API. `gh api .../pulls/N/files` needs
          # `pull-requests: read`, and the default token was refused it in the
          # peer repository: 403, an empty list, and a permanent fall back to
          # the full lane. A diff against the base needs only this checkout.
          FILES=$(git diff --name-only "$BASE...HEAD") || FILES=""
          echo "changed files:"
          printf '%s\n' "$FILES" | sed 's/^/  /'
          # The rule itself lives in scripts/ci_lane.sh, which
          # tests/test_ci_lane_selection.py drives directly. An empty list
          # reaches it as no paths, which it classifies as full.
          LANE=$(printf '%s\n' "$FILES" | bash scripts/ci_lane.sh)
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          echo "::notice::lane=$LANE"

  # Every dashboard check, on both lanes: the complete vitest suite, the audit,
  # and the production build. On the fast lane it is the whole gate.
  #
  # Why the fast lane may skip everything else, for its paths:
  #   - No Python test reads the dashboard tree. The one test that walks the
  #     repository (tests/test_interview_booking_regression_baseline.py) lists
  #     "dashboard" in its skip set, so pytest's inputs are byte-identical to
  #     the last run on main.
  #   - The image's web stage is `npm ci && npm run build` from dashboard/
  #     (Dockerfile, web-build). `npm run build` here is that same command, so a
  #     frontend change that would break the image build fails this job first.
  #   - package.json and package-lock.json are outside the allowlist, so `npm ci`
  #     inside the image resolves an unchanged lockfile.
  #   - The container health, migration and persistence steps exercise Python
  #     this lane cannot have changed.
  # The deploy still builds the real image and verifies /version, health, every
  # container and public 200 on the host.
  dashboard:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json}
      - run: npm ci
        working-directory: dashboard
      - run: npm audit --omit=dev --audit-level=critical
        working-directory: dashboard
      - run: npm test -- --run
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  # The backend half of what used to be one sequential `verify` job. The three
  # full-lane jobs run side by side; together they are every step it ran.
  python:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: business_ci, POSTGRES_PASSWORD: business_ci, POSTGRES_DB: business_ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U business_ci" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DASHBOARD_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt pytest
      - run: pip check
      - run: python -m core.migrations.runner
        env: {DATABASE_URL: "postgresql://business_ci:business_ci@localhost:5432/business_ci"}
      - name: Verify migrations are idempotent
        run: test -z "$(python -m core.migrations.runner)"
        env: {DATABASE_URL: "postgresql://business_ci:business_ci@localhost:5432/business_ci"}
      - name: PostgreSQL append-only audit and concurrent retry guarantees
        run: python -m pytest tests/test_booking_audit_append_only_pg.py -q
        env: {AUDIT_TEST_DATABASE_URL: "postgresql://business_ci:business_ci@localhost:5432/business_ci"}
      - run: python -m compileall -q core services workers features main.py
      # DATABASE_URL is deliberately NOT set for the suite. The candidate store
      # has a file backend and a PostgreSQL backend, and the tests isolate by
      # monkeypatching the file path. With DATABASE_URL exported job-wide every
      # test shares one candidates_store table, so unrelated tests collide with
      # "An active profile already exists for phone ...". Scoping the variable
      # to the migration steps restores the isolation the tests are built on.
      - run: python -m pytest -q

  # The real image, built with the layer cache the deploy build also uses, then
  # run the way production runs it: migrations, health, the commit it reports,
  # and persistence across a restart.
  container:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: teleautomation-operations-ci:${{ github.sha }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=operations-image
          cache-to: type=gha,scope=operations-image,mode=max
      - run: cp .env.example .env
      - name: Run both services from the image just built
        run: |
          cat > compose.ci-image.yml <<EOF
          services:
            api: {image: "teleautomation-operations-ci:${GITHUB_SHA}", pull_policy: never}
            migrate: {image: "teleautomation-operations-ci:${GITHUB_SHA}", pull_policy: never}
          EOF
          echo "COMPOSE_FILE=docker-compose.yml:compose.ci-image.yml" >> "$GITHUB_ENV"
      - run: docker compose up -d --no-build
        env: {TELEAUTOMATION_SAFE_UI_MODE: "true"}
      - name: Health check
        run: curl --fail --retry 24 --retry-delay 5 --retry-all-errors http://127.0.0.1:8200/health
      # What the deploy verifies on the host, proven here first: the commit
      # baked into the image is the one /version reports.
      - name: /version reports the commit the image was built from
        run: |
          got=$(curl -s http://127.0.0.1:8200/version | python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])')
          [ "$got" = "$GITHUB_SHA" ] || { echo "::error::/version is $got, expected $GITHUB_SHA"; exit 1; }
          label=$(docker image inspect "teleautomation-operations-ci:${GITHUB_SHA}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          [ "$label" = "$GITHUB_SHA" ] || { echo "::error::image revision label is $label, expected $GITHUB_SHA"; exit 1; }
      - name: Migrations ran inside the container and are idempotent
        run: |
          docker compose run --rm -T migrate | tee /tmp/second-run.txt
          test ! -s /tmp/second-run.txt
      - name: Persistence survives a container restart
        run: |
          docker compose exec -T db psql -U operations -d operations -c \
            "CREATE TABLE IF NOT EXISTS ci_persistence_probe(id int primary key); \
             INSERT INTO ci_persistence_probe VALUES (1) ON CONFLICT DO NOTHING;"
          docker compose restart
          curl --fail --retry 24 --retry-delay 5 --retry-all-errors http://127.0.0.1:8200/health
          test "$(docker compose exec -T db psql -U operations -d operations -tAc \
            'SELECT count(*) FROM ci_persistence_probe' | tr -d '[:space:]')" = "1"
      - if: always()
        run: docker compose down -v

  # Operations against Marketing, exactly as Marketing CI runs it the other way
  # round: both repositories share scripts/ci_dual_service.sh in Marketing, so
  # the dual-service contracts, the staging stack and the backup/restore/rollback
  # rehearsal are the same checks from either side.
  dual-service:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Check for the read-only Marketing key
        id: key
        env:
          HAS_KEY: ${{ secrets.MARKETING_READ_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [ "$REQUIRE_DUAL_SERVICE" = "true" ]; then
            echo "::error::MARKETING_READ_DEPLOY_KEY is not set, so the dual-service verification cannot run"
            exit 1
          fi
          echo "::notice::Dual-service verification SKIPPED: MARKETING_READ_DEPLOY_KEY is not set yet. The Marketing release-anchor PR still runs it before any deploy."
      - uses: actions/checkout@v4
        if: steps.key.outputs.available == 'true'
        with: {path: teleautomation-business}
      - uses: actions/checkout@v4
        if: steps.key.outputs.available == 'true'
        with:
          repository: codetrust2025-spec/teleautomation-messaging
          ssh-key: ${{ secrets.MARKETING_READ_DEPLOY_KEY }}
          path: teleautomation-messaging
          # The rollback rehearsal checks out a real previous commit.
          fetch-depth: 0
      # Paired changes are made on identically named branches in both
      # repositories and merge together, so when Marketing has a branch of the
      # same name, that pair is what will ship: verify against it. Otherwise
      # verify against Marketing main.
      - name: Pair with a same-named Marketing branch
        if: steps.key.outputs.available == 'true'
        working-directory: teleautomation-messaging
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -n "$BRANCH" ] && git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch --quiet origin "$BRANCH"
            git checkout --quiet FETCH_HEAD
            echo "::notice::Verifying against the paired Marketing branch $BRANCH"
          else
            echo "::notice::Verifying against Marketing main"
          fi
      - name: Cross-repository verification
        if: steps.key.outputs.available == 'true'
        working-directory: teleautomation-messaging
        run: |
          [ -f scripts/ci_dual_service.sh ] || { echo "::error::Marketing has no scripts/ci_dual_service.sh at this commit"; exit 1; }
          bash scripts/ci_dual_service.sh

  # One check that always runs and always reflects the whole workflow.
  #
  # A workflow whose every job can be skipped could present nothing to fail on,
  # so this job runs unconditionally and fails unless every job the selected
  # lane requires succeeded. It is the single status a merge requires.
  ci:
    needs: [classify, dashboard, python, container, dual-service]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          LANE: ${{ needs.classify.outputs.lane }}
          CLASSIFY: ${{ needs.classify.result }}
          DASHBOARD: ${{ needs.dashboard.result }}
          PYTHON: ${{ needs.python.result }}
          CONTAINER: ${{ needs.container.result }}
          DUAL: ${{ needs.dual-service.result }}
        run: |
          set -eu
          echo "lane=$LANE classify=$CLASSIFY dashboard=$DASHBOARD python=$PYTHON container=$CONTAINER dual-service=$DUAL"
          if [ "$CLASSIFY" != success ]; then
            echo "::error::classification failed"; exit 1
          fi
          [ "$DASHBOARD" = success ] || { echo "::error::dashboard checks failed"; exit 1; }
          case "$LANE" in
            frontend)
              for job in "python=$PYTHON" "container=$CONTAINER" "dual-service=$DUAL"; do
                [ "${job#*=}" = skipped ] || { echo "::error::${job%%=*} should be skipped on the frontend lane"; exit 1; }
              done
              ;;
            full)
              for job in "python=$PYTHON" "container=$CONTAINER" "dual-service=$DUAL"; do
                [ "${job#*=}" = success ] || { echo "::error::${job%%=*} did not pass on the full lane"; exit 1; }
              done
              ;;
            *)
              echo "::error::unknown lane '$LANE'"; exit 1
              ;;
          esac
          echo "ci gate passed on the $LANE lane"
